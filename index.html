<html lang="th">
<head>

<style>
:root{--gold:#fff18a;--ink:#eef5ff;--mute:#aebbdb;--night:#0e1a3b;--dusk:#1d2a57;--glow:#3d6482;--panel:#233765}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Bai Jamjuree","Sarabun",system-ui,sans-serif;color:var(--ink);overflow:hidden;
 background:linear-gradient(180deg,var(--night) 0%,var(--dusk) 62%,var(--glow) 100%);
 padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.dot{position:fixed;border-radius:50%;background:#fff;opacity:.6;animation:tw var(--d) ease-in-out infinite alternate;pointer-events:none}
@keyframes tw{from{opacity:.15}to{opacity:.85}}
header{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 22px 0;z-index:5;pointer-events:none}
h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:600;color:var(--gold);letter-spacing:.02em}
header h1,header p{text-shadow:0 1px 8px rgba(5,5,24,.8)}
header p{margin:4px 0 0;color:var(--mute);font-size:15px}
#count{font-size:13px}
.star{position:fixed;top:0;left:0;z-index:2;padding:0;border:0;background:none;
 filter:drop-shadow(0 0 8px var(--gc,#ffd982));will-change:transform}
.star svg,.star img{width:100%;height:100%;display:block}
.star.mine{z-index:3;filter:drop-shadow(0 0 18px var(--gc,#ffd982))}
.star:hover{filter:drop-shadow(0 0 16px #fff)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
 padding:40px 14px calc(100px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(144,182,209,.30) 50%)}
.btn{border:1.5px solid rgba(255,217,130,.55);background:rgba(23,20,70,.7);padding:11px 18px;border-radius:999px;font-size:16px}
.btn:hover{background:rgba(60,45,120,.8)}
.btn.primary{background:var(--gold);color:#2b1b3d;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:#ffe7ac}
dialog{background:var(--panel);color:var(--ink);border:1.5px solid rgba(255,217,130,.4);border-radius:20px;
 width:min(94vw,460px);max-height:88vh;padding:22px;overflow:auto}
dialog::backdrop{background:rgba(5,5,24,.72)}
dialog h2{margin:0 0 12px;font-size:22px;color:var(--gold);font-weight:600}
.x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;color:var(--mute);line-height:1}
label,.lbl{display:block;margin:14px 0 6px;color:var(--mute);font-size:14px}
textarea,input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#0c1a33;border:1.5px solid #436490;border-radius:12px;padding:10px 12px}
textarea{resize:vertical}
textarea::placeholder,input::placeholder{font-size:13px;opacity:.7}
textarea:focus,input:focus{border-color:#faf8b4;background:#0c1a33;outline:none}
small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{width:48px;height:48px;padding:8px;border-radius:12px;border:1.5px solid #436490;background:#0c1a33}
.opt[aria-pressed=true]{border-color:var(--gold);background:#244168}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1.5px #4a4390}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold)}
.prev{width:84px;height:84px;margin:0 auto;filter:drop-shadow(0 0 14px var(--gc))}
.prev svg,.big svg,.li svg,.prev img,.big img,.opt img{width:100%;height:100%;display:block;object-fit:contain}
.big{width:96px;height:96px;margin:6px auto 12px;filter:drop-shadow(0 0 16px var(--gc))}
.wish{font-size:20px;line-height:1.7;text-align:center;margin:0;overflow-wrap:anywhere}
.by{text-align:center;color:var(--mute);margin-top:10px;font-size:14px}
.go{width:100%;margin-top:18px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid #3a3480;background:#0e0c33}
.li:hover{border-color:var(--gold)}
.li .ic{flex:0 0 30px;height:30px}
.li span.t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.spin{animation:sp 1s ease-in-out}
@keyframes sp{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(540deg) scale(1.15)}100%{transform:rotate(720deg) scale(1)}}
.fh{font-size:24px;text-align:center;margin:0 0 8px;color:var(--gold)}
.facts{display:flex;justify-content:center;gap:18px;margin-top:14px;color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-90px);z-index:20;
 background:var(--gold);color:#2b1b3d;padding:10px 18px;border-radius:999px;transition:transform .35s;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
#splash{--tm:1000ms;position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
 text-align:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) 24px;
 background:radial-gradient(ellipse at 50% 42%,rgba(14,26,59,.5),rgba(14,26,59,.92));
 transition:opacity var(--tm),transform var(--tm) ease-in,filter var(--tm),clip-path var(--tm) ease-in-out}
#splash.out{pointer-events:none}
#splash[data-t=fade].out{opacity:0}
#splash[data-t=zoom].out{opacity:0;transform:scale(2.2);filter:blur(8px)}
#splash[data-t=iris]{clip-path:circle(150% at 50% 50%)}
#splash[data-t=iris].out{clip-path:circle(0% at 50% 50%)}
#splash[data-t=wipe]{clip-path:inset(0 0 0 0)}
#splash[data-t=wipe].out{clip-path:inset(0 0 100% 0)}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
 background:radial-gradient(circle at 50% 55%,#fff 0,#ffe7ac 28%,rgba(255,217,130,0) 72%);animation:fl var(--tm,1000ms) ease-in-out forwards}
@keyframes fl{0%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(2)}}
nav,header{transition:opacity .8s .2s,transform .8s .2s}
body.pre nav{opacity:0;transform:translateY(30px)}
body.pre header{opacity:0}
.btn.imgbtn,.btn.primary.imgbtn,.x.imgbtn{background:none;border:0;padding:0;border-radius:0}
.btn.imgbtn:hover,.btn.primary.imgbtn:hover{background:none;filter:brightness(1.15);transform:scale(1.04)}
#bMusic{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:6;width:44px;height:44px;display:grid;place-items:center;padding:0;
 border-radius:50%;border:1.5px solid rgba(255,217,130,.55);background:rgba(23,20,70,.7);color:var(--gold);transition:opacity .8s .2s}
#bMusic[hidden]{display:none}
#bMusic:hover{background:rgba(60,45,120,.8)}
#bMusic svg{width:24px;height:24px}
#bMusic.mimg{width:auto;height:auto;border:0;border-radius:0;background:none}
#bMusic.mimg img{display:block;height:44px;width:auto}
#bMusic.mimg.off img{opacity:.45}
body.pre #bMusic{opacity:0;pointer-events:none}
.loader{width:min(82vw,var(--lw,420px));margin-top:18px;transition:opacity .5s}
.loader.done{opacity:0}
.loader .lt{margin-top:12px;font-size:15px;color:var(--mute)}
.track{position:relative;height:var(--lh,14px);border-radius:var(--lr,999px);background:var(--ltrack,rgba(255,255,255,.14));
 border:1.5px solid var(--lborder,rgba(255,217,130,.5));box-shadow:inset 0 1px 3px rgba(0,0,0,.4);padding:var(--linset,0px)}
.fill{height:100%;width:0;border-radius:inherit;background:var(--lfill,linear-gradient(90deg,#ff9fb8,var(--gold)));box-shadow:0 0 12px var(--lglow,rgba(255,217,130,.6))}
.track.img{background:var(--ltrack) center/100% 100% no-repeat;border:0;box-shadow:none;border-radius:0}
.track.img .fill{box-shadow:none;border-radius:0}
.runner{position:absolute;left:0;bottom:calc(100% + 2px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.runner b{font-size:15px;font-weight:600;color:var(--gold);text-shadow:0 1px 6px rgba(5,5,24,.9)}
.runner .ic{width:var(--isz,44px);height:var(--isz,44px);animation:bob .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px var(--gold))}
.runner .ic img,.runner .ic svg{width:100%;height:100%;display:block;object-fit:contain}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-6px) rotate(6deg)}}
.pop{animation:pop .6s ease-out backwards}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.imgbtn img{display:block;height:56px;width:auto;max-width:100%;pointer-events:none}
#splash .imgbtn img{height:76px}
.x.imgbtn img{height:34px}
.go.imgbtn{width:auto;display:block;margin:18px auto 0}
.go.imgbtn img{height:60px}
#splash img{width:min(52vw,220px);height:auto;max-height:30vh;object-fit:contain}
#splash h1{font-size:clamp(48px,13vw,104px);line-height:1.05;text-shadow:0 0 28px rgba(255,217,130,.45)}
#splash .sub{margin:0;font-size:clamp(18px,4.5vw,26px);color:var(--ink)}
#splash .txt{margin:0;max-width:30em;color:var(--mute);line-height:1.7}
#splash .btn{margin-top:14px;padding:13px 44px;font-size:19px}
@media (prefers-reduced-motion:reduce){.dot,.spin,.runner .ic,.pop{animation:none}#splash,nav,header{transition:none}}
</style>
</head>
<body>
<header>
  <p id="count"></p>
</header>
<div id="sky"></div>
<nav>
  <button class="btn primary" id="bWrite">เขียนคำอธิษฐาน</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>

addEventListener("error", e => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#ffe3e3;color:#7a0000;padding:10px 14px;border-radius:10px;font:14px/1.5 system-ui,sans-serif";
  d.textContent = "เกิดข้อผิดพลาด: " + e.message + (e.lineno ? " (บรรทัด " + e.lineno + ")" : "");
  document.body.append(d);
});
</script>
<script>

const DB_URL = "https://msg-path-of-luminary-default-rtdb.asia-southeast1.firebasedatabase.app";
const DB_BASE = DB_URL.trim().replace(/\/wishes\.json.*$/,"").replace(/\/+$/,"");

const BACKGROUND_IMAGE = "";
const STAR_IMAGES = [];
const USE_IMG = STAR_IMAGES.length > 0;

/* starttitle */
const SPLASH_TITLE = "";
const SPLASH_SUBTITLE = "";
const SPLASH_TEXT = "คำโปรยยังคิดไม่ออกง่ะจะมีมั้ย";
const SPLASH_IMAGE = "assets/seisenseki-logo.png";
const START_LABEL = "START";

/* imgbutt */
const BUTTON_IMAGES = { write:"", start:"", submit:"", close:"", music:"", musicOff:"" };

/* Title */
const SPLASH_BACKGROUND = "";
const SPLASH_ALIGN = "bottom";

const SPLASH_LOGO_SIZE = 450;
const SPLASH_LOGO_OFFSET = [X: 212, Y: 127];
const SPLASH_TEXT_OFFSET = [0, 0];
const SPLASH_BUTTON_OFFSET = [X: 1514, Y: 733];
const TRANSITION = "flash";
const TRANSITION_MS = 1000;

/* loadingbar */
const LOADER_ICON = "";
const LOADER_ICON_SIZE = 44;
const LOADER_TEXT = "loading…";
const LOADER_MIN_MS = 2200;

/* assloadingbar */
const LOADER_COLORS = ["#233765", "#f7f2f0"];
const LOADER_TRACK_COLOR = "rgba(255,255,255,.14)";
const LOADER_BORDER_COLOR = "rgba(255,217,130,.5)";
const LOADER_WIDTH = 500;
const LOADER_HEIGHT = 14;
const LOADER_RADIUS = "999px";
const LOADER_TRACK_IMAGE = "";
const LOADER_FILL_IMAGE = "";
const LOADER_FILL_INSET = 0;

/* bgm */
const MUSIC_SRC = "assets/Hoshiboshisan_offvocal_.mp3";
const MUSIC_VOLUME = 0.5;
const MUSIC_AUTOPLAY = true;

 
const FAVICON = "assets/Mahoushiki_Logo.png";
try { if (FAVICON) { const f = document.getElementById("fav"); f.removeAttribute("type"); f.href = FAVICON + (FAVICON.startsWith("data:") ? "" : "?v=2"); } } catch {}

const COLORS = ["#ffd982","#ff9fb8","#9fd8ff","#b9a6ff","#a8f0c6","#ffb27a"];
const COLOR_NAMES = ["ทอง","ชมพู","ฟ้า","ม่วง","เขียวมินต์","ส้ม"];
const poly = (n, r) => { const p=[]; for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,R=i%2?r*10:10;p.push((R*Math.cos(a)).toFixed(2)+","+(R*Math.sin(a)).toFixed(2))} return "M"+p.join("L")+"Z"; };
const SHAPES = {
  star5:{n:"ดาวห้าแฉก", d:poly(5,.42)},
  sparkle:{n:"ประกายสี่แฉก", d:poly(4,.2)},
  star6:{n:"ดาวหกแฉก", d:poly(6,.58)},
  star8:{n:"ดาวแปดแฉก", d:poly(8,.62)},
  heart:{n:"ดาวหัวใจ", d:"M0 9.5C-7-4-9-6-9-8.5-9-12 0-13 0-6 0-13 9-12 9-8.5 9-6 7-4 0 9.5Z", t:"translate(0,3) scale(.9)"}
};
const shapeKeys = () => USE_IMG ? STAR_IMAGES : Object.keys(SHAPES);
const randShape = i => { const k = shapeKeys(); return k[(i ?? Math.floor(Math.random()*k.length)) % k.length]; };
const SEED = [
 ["ขอให้พ่อแม่สุขภาพแข็งแรงตลอดไป","A"],["ขอให้สอบผ่านนะ สู้ ๆ","B"],["อยากให้แมวที่บ้านอยู่กับเรานานๆ","C"],
 ["ขอให้ปีหน้าได้เที่ยวทะเลบ่อยๆ","D"],["ขอบคุณทุกคนที่อยู่ข้างกันมาตลอด","E"]
].map((x,i)=>({t:x[0],n:x[1],s:randShape(i),c:COLORS[i%6],at:i,seed:1}));

const FORTUNES = [
 {h:"โชคดีกำลังเดินทางมา",t:"สิ่งที่เคยติดขัดจะเริ่มคลี่คลายในไม่ช้า ลองเปิดใจรับโอกาสเล็กๆ ที่เข้ามา",n:7,c:"ทอง"},
 {h:"ความรักและมิตรภาพอบอุ่น",t:"มีคนคิดถึงคุณมากกว่าที่คิด ทักไปหาคนที่ห่างหายกันดูสักครั้ง",n:2,c:"ชมพู"},
 {h:"การงานก้าวหน้า",t:"ความพยายามที่ผ่านมากำลังออกผล อดทนอีกนิดแล้วจะมีคนมองเห็น",n:9,c:"ฟ้า"},
 {h:"ได้พักใจ",t:"ช่วงนี้ควรเดินช้าลงและดูแลตัวเอง เรื่องที่กังวลไม่ได้ใหญ่อย่างที่กลัว",n:5,c:"เขียวมินต์"},
 {h:"โชคลาภเล็กๆ",t:"มีของดีหรือข่าวดีมาแบบไม่คาดคิด แต่อย่าลืมใช้จ่ายอย่างพอดี",n:3,c:"ส้ม"},
 {h:"ปัญญาเปิดทาง",t:"ตัดสินใจเรื่องสำคัญได้ชัดขึ้น ถ้าสงสัยให้ถามผู้ใหญ่ที่ไว้ใจ",n:8,c:"ม่วง"},
 {h:"เดินทางราบรื่น",t:"การไปไหนมาไหนเป็นมงคล ทริปที่วางแผนไว้จะสนุกกว่าที่คิด",n:6,c:"ฟ้า"},
 {h:"สุขภาพดีขึ้น",t:"ร่างกายกำลังฟื้นตัว นอนให้พอและดื่มน้ำเยอะๆ จะยิ่งดี",n:1,c:"เขียวมินต์"},
 {h:"เริ่มต้นใหม่ได้เสมอ",t:"เรื่องเก่าที่ค้างใจจะเบาลง ถึงเวลาเริ่มสิ่งที่เลื่อนมานาน",n:4,c:"ทอง"},
 {h:"มีผู้อุปถัมภ์",t:"จะมีคนยื่นมือช่วยในจังหวะที่ต้องการ อย่าลืมขอบคุณและส่งต่อให้คนอื่น",n:0,c:"ชมพู"},
 {h:"ความฝันใกล้เข้ามา",t:"เป้าหมายที่ตั้งไว้ยังอยู่ในเส้นทาง แค่ก้าวต่อไปทีละก้าว",n:8,c:"ม่วง"},
 {h:"เงียบสงบแต่มั่นคง",t:"ไม่ต้องรีบแข่งกับใคร จังหวะของคุณกำลังพอดี",n:5,c:"ส้ม"}
];


const lsGet = () => { try { return JSON.parse(localStorage.getItem("loydao")||"[]"); } catch { return []; } };
const lsSet = v => { try { localStorage.setItem("loydao", JSON.stringify(v)); } catch {} };
const store = {
  async load(){
    let remote = [];
    if (DB_BASE) { try { const r = await fetch(`${DB_BASE}/wishes.json?orderBy="$key"&limitToLast=150`); const o = await r.json();
      if (!r.ok || (o && o.error)) throw new Error((o && o.error) || r.status);
      remote = Object.values(o||{}).filter(x=>x && typeof x==="object"); }
      catch (err) { toast("เชื่อมต่อฐานข้อมูลไม่ได้: "+err.message); } }
    return [...remote, ...lsGet()];
  },
  async save(w){
    if (DB_BASE) { try { const r = await fetch(`${DB_BASE}/wishes.json`,{method:"POST",body:JSON.stringify(w)}); if (r.ok) return; } catch {} }
    lsSet([...lsGet(), w].slice(-100));
  }
};
const clean = w => ({ t:String(w.t||"").slice(0,140), n:String(w.n||"").slice(0,20),
  s:(USE_IMG?STAR_IMAGES.includes(w.s):SHAPES[w.s])?w.s:randShape(), c:COLORS.includes(w.c)?w.c:COLORS[0], at:+w.at||0 });

 
const $ = id => document.getElementById(id);
const h = (tag, a={}, ...kids) => { const e=document.createElement(tag);
  for (const k in a) k.startsWith("on") ? e[k]=a[k] : k==="class" ? e.className=a[k] : e.setAttribute(k,a[k]);
  e.append(...kids); return e; };
const starSVG = (s,c) => {
  if (USE_IMG) { const src = STAR_IMAGES.includes(s) ? s : STAR_IMAGES[0]; return `<img src="${src.replace(/"/g,"%22")}" alt="" draggable="false">`; }
  const sh=SHAPES[s]||SHAPES.star5;
  return `<svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="${sh.d}" ${sh.t?`transform="${sh.t}"`:""} fill="${c}" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/></svg>`; };
const imgBtn = (b, key, label) => { const src = BUTTON_IMAGES[key]; if (!src) return b;
  b.classList.add("imgbtn"); b.replaceChildren(h("img",{src,alt:"",draggable:"false"})); b.setAttribute("aria-label",label); return b; };
const starEl = (cls,s,c) => { const e=h("div",{class:cls}); e.style.setProperty("--gc",c); e.innerHTML=starSVG(s,c); return e; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT; const toast = m => { const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200); };

/* massbox */
const dlg = $("dlg");
dlg.addEventListener("click", e => { if (e.target===dlg) dlg.close(); });
const show = (...nodes) => { dlg.replaceChildren(imgBtn(h("button",{class:"x","aria-label":"ปิด",onclick:()=>dlg.close()},"×"),"close","ปิด"),...nodes); if(!dlg.open) dlg.showModal(); };

function showWish(w){
  show(starEl("big",w.s,w.c), h("p",{class:"wish"},w.t), h("p",{class:"by"}, w.n ? "จาก "+w.n : "จากผู้ไม่ประสงค์ออกนาม"));
}

function openWrite(){
  let shape=shapeKeys()[0], color=COLORS[0];
  const prev = h("div",{class:"prev"});
  const ta = h("textarea",{id:"ta",maxlength:"140",rows:"4",required:"",placeholder:"ลองอธิษฐานกับดวงดาวดูสิ บางทีความปรารถนานั้นอาจเป็นจริงก็ได้นะ?"});
  const cnt = h("small",{},"0/140");
  const nm = h("input",{id:"nm",maxlength:"20",placeholder:"สามารถเว้นว่างได้"});
  const shapeRow = h("div",{class:"row",role:"group","aria-label":"รูปดาว"});
  const colorRow = h("div",{class:"row",role:"group","aria-label":"สีของดาว"});
  const paint = () => {
    prev.style.setProperty("--gc",color); prev.innerHTML=starSVG(shape,color);
    [...shapeRow.children].forEach(b=>{ b.setAttribute("aria-pressed",b.dataset.k===shape); b.innerHTML=starSVG(b.dataset.k,color); });
    [...colorRow.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===color));
  };
  shapeKeys().forEach((k,i)=>{ const nmS = SHAPES[k] ? SHAPES[k].n : "ดาวแบบที่ "+(i+1);
    shapeRow.append(h("button",{type:"button",class:"opt","data-k":k,title:nmS,"aria-label":nmS,onclick:()=>{shape=k;paint();}})); });
  COLORS.forEach((c,i)=>{ const b=h("button",{type:"button",class:"sw","data-k":c,title:COLOR_NAMES[i],"aria-label":COLOR_NAMES[i],onclick:()=>{color=c;paint();}}); b.style.background=c; colorRow.append(b); });
  const colorWrap = h("div",{},h("div",{class:"lbl"},"เลือกสี"),colorRow);
  if (USE_IMG) colorWrap.hidden = true;
  ta.oninput = () => cnt.textContent = ta.value.length+"/140";
  const form = h("form",{onsubmit:async e=>{
      e.preventDefault(); const t=ta.value.trim(); if(!t) return;
      const w = clean({t,n:nm.value.trim(),s:shape,c:color,at:Date.now()});
      await store.save(w); pool.push(w); updateCount(); dlg.close(); spawn(w,{mine:true}); toast("ดวงดาวได้ตอบรับคำอธิษฐานแล้ว");
    }},
    h("h2",{},"เขียนคำอธิษฐาน"), prev,
    h("label",{for:"ta"},"คำอธิษฐาน"), ta, h("div",{style:"text-align:right"},cnt),
    h("label",{for:"nm"},"ชื่อตัวละคร"), nm,
    h("div",{class:"lbl"},"เลือกรูปดาว"), shapeRow,
    colorWrap,
    imgBtn(h("button",{class:"btn primary go",type:"submit"},"อธิษฐาน"),"submit","อธิษฐาน"));
  paint(); show(form); ta.focus();
}

const FORTUNE_RATE = .3;
const makeFortune = () => ({ fortune:FORTUNES[Math.floor(Math.random()*FORTUNES.length)],
  s:randShape(), c:COLORS[Math.floor(Math.random()*COLORS.length)] });
const pickItem = (free=pool) => (Math.random()<FORTUNE_RATE || !free.length) ? makeFortune() : free[Math.floor(Math.random()*free.length)];

function showFortune(it){
  const f=it.fortune, body=h("div");
  body.replaceChildren(starEl("big"+(reduce?"":" spin"),it.s,it.c));
  show(body);
  setTimeout(()=>{
    body.replaceChildren(starEl("big",it.s,it.c), h("p",{class:"fh"},f.h), h("p",{class:"wish",style:"font-size:17px"},f.t),
      h("div",{class:"facts"},h("span",{},"เลขนำโชค "+f.n),h("span",{},"สีมงคล "+f.c)));
  }, reduce?0:1000);
}
const showItem = it => it.fortune ? showFortune(it) : showWish(it);

let pool = [...SEED];
const active = new Set();
const maxActive = () => innerWidth<600 ? 9 : 16;
const updateCount = () => { const c=$("count"); if (c) c.textContent = `คำอธิษฐานทั้งหมดตอนนี้ ${pool.length} ดวง`; };

function spawn(w, {mine=false, progress=0}={}){
  const size = mine ? 72 : 30+Math.random()*28;
  const el = h("button",{class:"star"+(mine?" mine":""),"aria-label":"เปิดอ่านคำอธิษฐาน"});
  el.style.width=el.style.height=size+"px"; el.style.setProperty("--gc",w.c); el.innerHTML=starSVG(w.s,w.c);
  $("sky").append(el); active.add(w);
  const W=innerWidth, H=innerHeight, dur=(mine?42000:28000+Math.random()*30000)*(reduce?2:1);
  const x0=Math.random()*Math.max(1,W-size);
  const offs=[0,.06,.3,.55,.8,.93,1];
  const frames=offs.map((o,i)=>({
    offset:o,
    opacity:(i===0||i===offs.length-1)?0:1,
    transform:`translate(${Math.min(W-size,Math.max(0,x0+(i&&i<offs.length-1?(Math.random()-.5)*180:0)))}px,${H-(o*(H+size+40))}px) rotate(${(Math.random()-.5)*40}deg)`
  }));
  const a = el.animate(frames,{duration:dur,easing:"linear",fill:"forwards"});
  a.currentTime = progress*dur;
  a.onfinish = () => { el.remove(); active.delete(w); };
  el.onpointerenter = () => a.pause();
  el.onpointerleave = () => a.play();
  el.onclick = () => showItem(w);
}

function spawnRandom(progress=0){
  if (active.size>=maxActive()) return;
  const free = pool.filter(w=>!active.has(w));
  spawn(pickItem(free),{progress});
}

if (BACKGROUND_IMAGE) document.body.style.background =
  `linear-gradient(rgba(14,26,59,.25),rgba(42,28,85,.35)), url("${encodeURI(BACKGROUND_IMAGE).replace(/"/g,"%22")}") center/cover fixed no-repeat`;
for (let i=0;i<70;i++){
  const d=h("div",{class:"dot"}), s=Math.random()*2.2+.8;
  d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*80}%;width:${s}px;height:${s}px;--d:${2+Math.random()*4}s`;
  document.body.prepend(d);
}

$("bWrite").onclick=openWrite; imgBtn($("bWrite"),"write","เขียนคำอธิษฐาน");

/* music */
const bMusic = h("button",{id:"bMusic",type:"button",hidden:"","aria-label":"เปิด/ปิดเพลง"});
let bgm = null, musicOn = false, fadeT;
const ICON_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const prefGet = () => { try { return localStorage.getItem("loydao_music"); } catch { return null; } };
const prefSet = v => { try { localStorage.setItem("loydao_music", v); } catch {} };
function paintMusic(){
  const img = musicOn ? BUTTON_IMAGES.music : (BUTTON_IMAGES.musicOff || BUTTON_IMAGES.music);
  bMusic.setAttribute("aria-pressed", musicOn);
  bMusic.title = musicOn ? "ปิดเพลง" : "เปิดเพลง";
  if (img) { bMusic.className = "mimg" + (musicOn || BUTTON_IMAGES.musicOff ? "" : " off"); bMusic.innerHTML = `<img src="${img.replace(/"/g,"%22")}" alt="" draggable="false">`; }
  else { bMusic.className = ""; bMusic.innerHTML = musicOn ? ICON_ON : ICON_OFF; }
}
function fadeTo(v, ms, done){
  clearInterval(fadeT); const from = bgm.volume, t0 = performance.now();
  fadeT = setInterval(()=>{ const k = Math.min(1,(performance.now()-t0)/ms); bgm.volume = from + (v-from)*k; if (k>=1){ clearInterval(fadeT); done && done(); } }, 50);
}
function playMusic(){
  bgm.play().then(()=>{ musicOn = true; paintMusic(); fadeTo(MUSIC_VOLUME, 1500); }).catch(()=>{ musicOn = false; paintMusic(); });
}
function startMusic(){
  if (!bgm) return;
  bMusic.hidden = false;
  if (musicOn) return;
  if (prefGet() === "off") { musicOn = false; paintMusic(); return; }
  playMusic();
}
function autoStartMusic(){
  if (!bgm || prefGet() === "off") return;
  bgm.play().then(()=>{ musicOn = true; bMusic.hidden = false; paintMusic(); fadeTo(MUSIC_VOLUME, 1500); }).catch(()=>{
    const evs = ["pointerdown","keydown","touchstart"];
    const once = () => { evs.forEach(ev => removeEventListener(ev, once, true)); if (!musicOn && prefGet() !== "off") { bMusic.hidden = false; playMusic(); } };
    evs.forEach(ev => addEventListener(ev, once, true));
  });
}
if (MUSIC_SRC) {
  bgm = new Audio(MUSIC_SRC); bgm.loop = true; bgm.volume = 0; bgm.preload = "auto";
  paintMusic(); document.body.append(bMusic);
  bMusic.onclick = () => {
    if (musicOn) { prefSet("off"); musicOn = false; paintMusic(); fadeTo(0, 400, ()=>bgm.pause()); }
    else { prefSet("on"); playMusic(); }
  };
   document.addEventListener("visibilitychange", () => {
    if (document.hidden) bgm.pause(); else if (musicOn) bgm.play().catch(()=>{});
  });
  if (MUSIC_AUTOPLAY) autoStartMusic();
}

/* loadingtile */
const withTimeout = (p, ms, fallback) => Promise.race([p, new Promise(r=>setTimeout(()=>r(fallback), ms))]);
const preload = src => withTimeout(new Promise(r=>{ const i=new Image(); i.onload=i.onerror=()=>r(); i.src=src; }), 10000);
const dataReady = withTimeout((async () => {
  const loaded = (await store.load()).map(clean).filter(w=>w.t);
  pool = [...SEED, ...loaded]; updateCount();
})(), 8000);

function startSky(){
  const n = Math.min(maxActive()-3, 7);
  for (let i=0;i<n;i++) spawnRandom(.1+Math.random()*.7);
  setInterval(spawnRandom, 2300);
  if (DB_BASE) setInterval(async()=>{ const l=(await store.load()).map(clean).filter(w=>w.t); pool=[...SEED,...l]; updateCount(); }, 60000);
}

(function(){
  const ms = reduce ? 0 : Math.max(0, TRANSITION_MS);
  const type = ["fade","zoom","iris","wipe","flash"].includes(TRANSITION) ? TRANSITION : "fade";
  const sp = h("div",{id:"splash",role:"region","aria-label":"หน้าเริ่มต้น","data-t":type});
  sp.style.setProperty("--tm", ms+"ms");
  if (SPLASH_BACKGROUND) sp.style.background =
    `linear-gradient(rgba(14,26,59,.2),rgba(14,26,59,.5)), url("${encodeURI(SPLASH_BACKGROUND).replace(/"/g,"%22")}") center/cover no-repeat`;
  sp.style.justifyContent = ({top:"flex-start",bottom:"flex-end"})[SPLASH_ALIGN] || "center";
  const off = v => Array.isArray(v) ? v.map(n => typeof n === "number" ? n+"px" : n).join(" ") : "";
  if (SPLASH_IMAGE) {
    const lg = h("img",{src:SPLASH_IMAGE,alt:""});
    lg.style.width = `min(80vw, ${SPLASH_LOGO_SIZE}px)`; lg.style.maxHeight = "60vh"; lg.style.translate = off(SPLASH_LOGO_OFFSET);
    sp.append(lg);
  }
  [SPLASH_TITLE && h("h1",{},SPLASH_TITLE), SPLASH_SUBTITLE && h("p",{class:"sub"},SPLASH_SUBTITLE), SPLASH_TEXT && h("p",{class:"txt"},SPLASH_TEXT)]
    .filter(Boolean).forEach(el => { el.style.translate = off(SPLASH_TEXT_OFFSET); sp.append(el); });

  /* ปุ่มเริ่ม (จะโผล่หลังโหลดครบ) */
  const go = imgBtn(h("button",{class:"btn primary",type:"button"},START_LABEL),"start",START_LABEL);
  let started = false;
  go.onclick = () => {
    if (started) return; started = true;
    startMusic();
    document.body.classList.remove("pre");
    sp.classList.add("out");
    if (type === "flash") {
      const f = h("div",{class:"flash"}); f.style.setProperty("--tm", ms+"ms"); document.body.append(f);
      setTimeout(()=>sp.remove(), ms*.45); setTimeout(()=>f.remove(), ms+50);
    } else setTimeout(()=>sp.remove(), ms+50);
  };

  /* แถบโหลด */
  const icon = h("div",{class:"ic"});
  icon.innerHTML = LOADER_ICON
    ? `<img src="${LOADER_ICON.replace(/"/g,"%22")}" alt="" draggable="false">`
    : `<svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="${SHAPES.star5.d}" fill="#ffd982" stroke="#ffd982" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  const pc = h("b",{},"0%");
  const runner = h("div",{class:"runner"},pc,icon);
  const fill = h("div",{class:"fill"});
  const bar = h("div",{class:"track",role:"progressbar","aria-valuemin":"0","aria-valuemax":"100","aria-valuenow":"0","aria-label":"กำลังโหลด"},fill,runner);
  const loader = h("div",{class:"loader"},bar,h("div",{class:"lt"},LOADER_TEXT));
  loader.style.setProperty("--isz", LOADER_ICON_SIZE+"px");
  loader.style.paddingTop = (LOADER_ICON_SIZE + 38)+"px";
  loader.style.translate = off(SPLASH_BUTTON_OFFSET); go.style.translate = off(SPLASH_BUTTON_OFFSET);
  const q = u => `url("${encodeURI(u).replace(/"/g,"%22")}")`;
  const cols = LOADER_COLORS.length > 1 ? LOADER_COLORS : [LOADER_COLORS[0] || "#fff18a", LOADER_COLORS[0] || "#fff18a"];
  const setV = (k,v) => loader.style.setProperty(k,v);
  setV("--lw", LOADER_WIDTH+"px"); setV("--lh", LOADER_HEIGHT+"px"); setV("--lr", LOADER_RADIUS);
  setV("--ltrack", LOADER_TRACK_COLOR); setV("--lborder", LOADER_BORDER_COLOR); setV("--linset", LOADER_FILL_INSET+"px");
  setV("--lfill", `linear-gradient(90deg,${cols.join(",")})`);
  setV("--lglow", `color-mix(in srgb, ${cols[cols.length-1]} 60%, transparent)`);
  if (LOADER_TRACK_IMAGE) { bar.classList.add("img"); setV("--ltrack", q(LOADER_TRACK_IMAGE)); }
  if (LOADER_FILL_IMAGE) { fill.style.backgroundImage = q(LOADER_FILL_IMAGE); fill.style.backgroundRepeat = "no-repeat"; fill.style.backgroundPosition = "left center"; }
  sp.append(loader); document.body.classList.add("pre"); document.body.append(sp);

  /* นับความคืบหน้าจากของจริงที่ต้องโหลด */
  const urls = [...new Set([BACKGROUND_IMAGE,SPLASH_BACKGROUND,SPLASH_IMAGE,LOADER_ICON,LOADER_TRACK_IMAGE,LOADER_FILL_IMAGE,...STAR_IMAGES,...Object.values(BUTTON_IMAGES)].filter(Boolean))];
  const tasks = [...urls.map(preload), withTimeout(document.fonts ? document.fonts.ready : Promise.resolve(), 10000), dataReady];
  let done = 0; tasks.forEach(p => p.then(()=>{ done++; }));
  const t0 = performance.now(), minMs = reduce ? 500 : Math.max(0, LOADER_MIN_MS);
  let shown = 0, finished = false;

  const finish = () => {
    if (finished) return; finished = true;
    startSky(); loader.classList.add("done");
    setTimeout(()=>{ loader.remove(); go.classList.add("pop"); sp.append(go); go.focus(); }, 500);
  };
  const tick = () => {
    const real = done / tasks.length;
    const tp = minMs ? Math.min(1, (performance.now()-t0)/minMs) : 1;
    const target = real >= 1 ? tp : Math.min(tp, Math.max(real, .9*tp), .99);
    shown += (target - shown) * .18;
    if (real >= 1 && tp >= 1 && shown > .995) shown = 1;
    const p = Math.round(shown*100);
    fill.style.width = p+"%";
    runner.style.left = LOADER_FILL_INSET ? `calc(${LOADER_FILL_INSET}px + (100% - ${2*LOADER_FILL_INSET}px) * ${p/100})` : p+"%";
    if (LOADER_FILL_IMAGE) fill.style.backgroundSize = (bar.clientWidth - 2*LOADER_FILL_INSET)+"px 100%";
     pc.textContent = p+"%"; bar.setAttribute("aria-valuenow", p);
    shown >= 1 ? finish() : requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
