.spin-f,.spin-r{animation:sspin var(--sp,4s) linear infinite;animation-play-state:paused}

@media (prefers-reduced-motion:reduce){.sstack,.sl{transition:none}.spin-f,.spin-r{animation:none}}

});

function spawn(w, {mine=false, progress=0}={}){
  const size = mine ? 72 : 30+Math.random()*28;
  const el = h("button",{class:"star"+(mine?" mine":""),"aria-label":"เปิดอ่านคำอธิษฐาน"});
  el.style.width=el.style.height=size+"px"; el.style.setProperty("--gc",w.c); el.innerHTML=starSVG(w.s,w.c);
  $("sky").append(el); active.add(w);
  const W=innerWidth, H=innerHeight, dur=(mine?42000:28000+Math.random()*30000)*(reduce?2:1);
  const x0=Math.random()*Math.max(1,W-size);
  const offs=[0,.06,.3,.55,.8,.93,1];
  const frames=offs.map((o,i)=>({
    offset:o,
    opacity:(i===0||i===offs.length-1)?0:1,
    transform:`translate(${Math.min(W-size,Math.max(0,x0+(i&&i<offs.length-1?(Math.random()-.5)*180:0)))}px,${H-(o*(H+size+40))}px) rotate(${(Math.random()-.5)*40}deg)`
  }));
  const a = el.animate(frames,{duration:dur,easing:"linear",fill:"forwards"});
  a.currentTime = progress*dur;
  a.onfinish = () => { el.remove(); active.delete(w); };
  el.onpointerenter = () => a.pause();
  el.onpointerleave = () => a.play();
  el.onclick = () => showItem(w);
}

function spawnRandom(progress=0){
  if (active.size>=maxActive()) return;
  const free = pool.filter(w=>!active.has(w));
  spawn(pickItem(free),{progress});
}

const prefGet = () => { try { return localStorage.getItem("loydao_music"); } catch { return null; } };
const prefSet = v => { try { localStorage.setItem("loydao_music", v); } catch {} };
const volGet = () => { try { const v = parseFloat(localStorage.getItem("loydao_vol")); return isNaN(v) ? null : Math.min(1, Math.max(0, v)); } catch { return null; } };
let vol = volGet() || MUSIC_VOLUME;
volIn.value = prefGet() === "off" ? 0 : Math.round(vol*100); volIn.style.setProperty("--v", volIn.value+"%");
volIn.oninput = () => {
  const v = volIn.value/100; volIn.style.setProperty("--v", volIn.value+"%");
  if (v > 0) { vol = v; try { localStorage.setItem("loydao_vol", v); } catch {} }
  if (!bgm) return;
  if (v === 0) { prefSet("off"); if (musicOn) { musicOn = false; paintMusic(); fadeTo(0, 200, ()=>bgm.pause()); } return; }
  if (musicOn) { clearInterval(fadeT); bgm.volume = vol; }
  else { prefSet("on"); playMusic(); }
};
function paintMusic(){
  const img = musicOn ? BUTTON_IMAGES.music : (BUTTON_IMAGES.musicOff || BUTTON_IMAGES.music);
  bMusic.setAttribute("aria-pressed", musicOn);
  bMusic.title = "ตั้งค่าเสียง";
  if (img) { bMusic.className = "mimg" + (musicOn || BUTTON_IMAGES.musicOff ? "" : " off"); bMusic.innerHTML = `<img src="${img.replace(/"/g,"%22")}" alt="" draggable="false">`; }
  else { bMusic.className = ""; bMusic.innerHTML = musicOn ? ICON_ON : ICON_OFF; }
}
function fadeTo(v, ms, done){
  clearInterval(fadeT); const from = bgm.volume, t0 = performance.now();
  fadeT = setInterval(()=>{ const k = Math.min(1,(performance.now()-t0)/ms); bgm.volume = from + (v-from)*k; if (k>=1){ clearInterval(fadeT); done && done(); } }, 50);
}
function playMusic(){
  bgm.play().then(()=>{ musicOn = true; paintMusic(); fadeTo(vol, 1500); }).catch(e=>{
    musicOn = false; paintMusic();
    if (e && e.name !== "NotAllowedError") toast("เล่นเพลงไม่ได้: " + (e.name || e));
  });
}
function startMusic(){
  if (!bgm) return;
  musicBox.hidden = false;
  if (!bgm.paused) return;
  if (prefGet() === "off") { musicOn = false; paintMusic(); return; }
  playMusic();
}
let musicHint = null;
const hideHint = () => { if (musicHint) { musicHint.remove(); musicHint = null; } };
function autoStartMusic(){
  if (!bgm || prefGet() === "off") return;
  bgm.play().then(()=>{ musicOn = true; musicBox.hidden = false; paintMusic(); fadeTo(vol, 1500); }).catch(()=>{
    musicOn = false; paintMusic();
    const evs = ["touchend","click","keydown"];
    const once = () => { evs.forEach(ev => removeEventListener(ev, once, true)); hideHint(); if (bgm.paused && prefGet() !== "off") { musicBox.hidden = false; playMusic(); } };
    evs.forEach(ev => addEventListener(ev, once, true));
  });
}

          if (L.ms) w.style.setProperty("--lms", L.ms+"ms");
          if (L.delay) w.style.setProperty("--ld", L.delay+"ms");
          const im = h("img",{src:L.src,alt:"",draggable:"false"});
          if (L.spin) { im.style.setProperty("--sp", Math.abs(L.spin)+"s"); im.classList.add(L.spin < 0 ? "spin-r" : "spin-f"); }
          w.append(im); stack.append(w);
        });
        b.append(stack); return b;
      })()
    : imgBtn(h("button",{class:"btn primary",type:"button"},START_LABEL),"start",START_LABEL);
  let started = false;
 
  go.onclick = () => {
    if (started) return; started = true;
    startMusic();
    document.body.classList.remove("pre");
    sp.classList.add("out");
    if (type === "flash") {
      const f = h("div",{class:"flash"}); f.style.setProperty("--tm", ms+"ms"); document.body.append(f);
      setTimeout(()=>sp.remove(), ms*.45); setTimeout(()=>f.remove(), ms+50);
    } else setTimeout(()=>sp.remove(), ms+50);
  };

  /* loading ui */
  const icon = h("div",{class:"ic"});
  icon.innerHTML = LOADER_ICON
    ? `<img src="${LOADER_ICON.replace(/"/g,"%22")}" alt="" draggable="false">`
    : `<svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="${SHAPES.star5.d}" fill="#ffd982" stroke="#ffd982" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  const pc = h("b",{},"0%");
  const runner = h("div",{class:"runner"},pc,icon);
  const fill = h("div",{class:"fill"});
  const bar = h("div",{class:"track",role:"progressbar","aria-valuemin":"0","aria-valuemax":"100","aria-valuenow":"0","aria-label":"กำลังโหลด"},fill,runner);
  const loader = h("div",{class:"loader"},bar,h("div",{class:"lt"},LOADER_TEXT));
  loader.style.setProperty("--isz", LOADER_ICON_SIZE+"px");
  loader.style.paddingTop = (LOADER_ICON_SIZE + 38)+"px";
  loader.style.translate = off(SPLASH_BUTTON_OFFSET); go.style.translate = off(SPLASH_BUTTON_OFFSET);
  const q = u => `url("${encodeURI(u).replace(/"/g,"%22")}")`;
  const cols = LOADER_COLORS.length > 1 ? LOADER_COLORS : [LOADER_COLORS[0] || "#fff18a", LOADER_COLORS[0] || "#fff18a"];
  const setV = (k,v) => loader.style.setProperty(k,v);
  setV("--lw", LOADER_WIDTH+"px"); setV("--lh", LOADER_HEIGHT+"px"); setV("--lr", LOADER_RADIUS);
  setV("--ltrack", LOADER_TRACK_COLOR); setV("--lborder", LOADER_BORDER_COLOR); setV("--linset", LOADER_FILL_INSET+"px");
  setV("--lfill", `linear-gradient(90deg,${cols.join(",")})`);
  setV("--lglow", `color-mix(in srgb, ${cols[cols.length-1]} 60%, transparent)`);
  if (LOADER_TRACK_IMAGE) { bar.classList.add("img"); setV("--ltrack", q(LOADER_TRACK_IMAGE)); }
  if (LOADER_FILL_IMAGE) { fill.style.backgroundImage = q(LOADER_FILL_IMAGE); fill.style.backgroundRepeat = "no-repeat"; fill.style.backgroundPosition = "left center"; }
  sp.append(loader); document.body.classList.add("pre"); document.body.append(sp);
  { const lh = loader.offsetHeight;
    sp.style.paddingBottom = `calc(40px + env(safe-area-inset-bottom) + ${lh+32}px)`;
    Object.assign(loader.style,{position:"absolute",left:"0",right:"0",margin:"0 auto",bottom:"calc(40px + env(safe-area-inset-bottom))"}); }

  /* loading per */
  const urls = [...new Set([BACKGROUND_IMAGE,SPLASH_BACKGROUND,SPLASH_IMAGE,LOADER_ICON,LOADER_TRACK_IMAGE,LOADER_FILL_IMAGE,...SPLASH_LAYERS.map(l=>l.src),...START_LAYERS.map(l=>l.src),...STAR_IMAGES,...Object.values(BUTTON_IMAGES)].filter(Boolean))];
  const tasks = [...urls.map(preload), withTimeout(document.fonts ? document.fonts.ready : Promise.resolve(), 10000), dataReady];
  let done = 0; tasks.forEach(p => p.then(()=>{ done++; }));
  const t0 = performance.now(), minMs = reduce ? 500 : Math.max(0, LOADER_MIN_MS);
  let shown = 0, finished = false;

  const finish = () => {
  if (finished) return; finished = true;
  startSky(); loader.classList.add("done");
  setTimeout(()=>{ loader.remove(); go.classList.add("pop"); sp.append(go); go.focus(); }, 500);
};
  const tick = () => {
    const real = done / tasks.length;
    const tp = minMs ? Math.min(1, (performance.now()-t0)/minMs) : 1;
    const target = real >= 1 ? tp : Math.min(tp, Math.max(real, .9*tp), .99);
    shown += (target - shown) * .18;
    if (real >= 1 && tp >= 1 && shown > .995) shown = 1;
    const p = Math.round(shown*100);
    fill.style.width = p+"%";
    runner.style.left = LOADER_FILL_INSET ? `calc(${LOADER_FILL_INSET}px + (100% - ${2*LOADER_FILL_INSET}px) * ${p/100})` : p+"%";
    if (LOADER_FILL_IMAGE) fill.style.backgroundSize = (bar.clientWidth - 2*LOADER_FILL_INSET)+"px 100%";
     pc.textContent = p+"%"; bar.setAttribute("aria-valuenow", p);
    shown >= 1 ? finish() : requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
